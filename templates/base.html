{% comment %} # base.html {% endcomment %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Eazy Fit{% endblock %}</title>
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">


    {% block extra_css %}{% endblock %}

    <style>
        /* Full-height layout for footer stickiness */
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        main {
            flex-grow: 1; /* Pushes footer to the bottom if content is less */
        }
    </style>

</head>
<body>
    <!-- Include the navbar -->
    {% include 'components/navbar.html' %}

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Include the footer -->
    {% include 'components/footer.html' %}

    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <!-- Load our API base and utilities -->
    <script src="{% static 'js/api/api_base.js' %}"></script>
    <script src="{% static 'js/api/pagination_utils.js' %}"></script>
    <script src="{% static 'js/auth_jwt.js' %}"></script>
    <script src="{% static 'profiles/js/auth.js' %}"></script>
    <!-- Load API modules -->
    <script src="{% static 'js/api/client_profile_api.js' %}"></script>
    <script src="{% static 'js/api/measurements_api.js' %}"></script>
    <script src="{% static 'js/api/subscriptions_api.js' %}"></script>
    <script src="{% static 'js/api/plan_management_api.js' %}"></script>
    <script src="{% static 'js/api/coach_analytics_api.js' %}"></script>
    <!-- Legacy API support -->
    <script src="{% static 'profiles/js/api.js' %}"></script>
    <!-- Main navbar functionality -->
    <script src="{% static 'js/navbar.js' %}"></script>
    <!-- Other scripts -->
    <script src="{% static 'js/scripts.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
