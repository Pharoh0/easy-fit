{% extends 'base.html' %}
{% load static %}

{% block title %}Staff • Certifications{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'vendor/datatables/datatables.min.css' %}">
<link rel="stylesheet" href="{% static 'vendor/datatables/dataTables.bootstrap5.min.css' %}">
<style>
  .filters .form-select { min-width: 160px; }
  .dt-actions .btn { margin-right: .25rem; margin-bottom: .25rem; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <h3 class="mb-0">Manage Certifications</h3>
</div>

<div class="card mb-3">
  <div class="card-body">
    <div class="row g-2 align-items-end filters">
      <div class="col-6 col-md-3">
        <label class="form-label">Status</label>
        <select id="filterStatus" class="form-select">
          <option value="">All</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <table id="certificationsTable" class="table table-striped" style="width:100%">
      <thead>
        <tr>
          <th>Coach</th>
          <th>Description</th>
          <th>File</th>
          <th>Status</th>
          <th>Verified At</th>
          <th>Verified By</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'vendor/datatables/jquery.dataTables.min.js' %}"></script>
<script src="{% static 'vendor/datatables/dataTables.bootstrap5.min.js' %}"></script>
<script src="{% static 'js/api/staff_api.js' %}"></script>
<script src="{% static 'js/staff/certifications.js' %}"></script>
{% endblock %}
