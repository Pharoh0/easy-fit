<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eazy Fit Hero Illustration">
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background blob shapes -->
  <g opacity="0.95">
    <path d="M1140,200 C1040,80 880,40 740,90 C600,140 540,260 430,310 C320,360 180,340 90,420 C0,500 20,660 150,740 C280,820 520,820 700,780 C880,740 1000,660 1080,560 C1160,460 1240,320 1140,200 Z" fill="url(#grad1)"/>
    <path d="M1060,620 C980,700 820,760 660,770 C500,780 340,740 230,660 C120,580 60,460 130,380 C200,300 400,300 540,250 C680,200 760,100 870,120 C980,140 1120,280 1140,400 C1160,520 1140,540 1060,620 Z" fill="url(#grad2)" opacity="0.25"/>
  </g>

  <!-- Device mockup card -->
  <g filter="url(#shadow)">
    <rect x="220" y="160" rx="28" ry="28" width="760" height="520" fill="#ffffff"/>
    <rect x="220" y="220" width="760" height="1" fill="#e5e7eb"/>
    <circle cx="260" cy="190" r="8" fill="#ef4444"/>
    <circle cx="285" cy="190" r="8" fill="#f59e0b"/>
    <circle cx="310" cy="190" r="8" fill="#22c55e"/>

    <!-- Chart lines -->
    <polyline points="300,560 380,480 460,520 540,420 620,460 700,380 780,420 860,360" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
    <polyline points="300,600 380,540 460,560 540,500 620,540 700,500 780,520 860,480" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>

    <!-- KPI cards -->
    <g>
      <rect x="300" y="260" width="200" height="120" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="320" y="300" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#111827">Active Clients</text>
      <text x="320" y="340" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#111827">128</text>
    </g>
    <g>
      <rect x="540" y="260" width="200" height="120" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="560" y="300" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#111827">Avg. Adherence</text>
      <text x="560" y="340" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#111827">92%</text>
    </g>
    <g>
      <rect x="780" y="260" width="160" height="120" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="800" y="300" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#111827">Plans</text>
      <text x="800" y="340" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#111827">36</text>
    </g>
  </g>

  <!-- Floating dumbbell icon -->
  <g transform="translate(920,140)" opacity="0.95">
    <rect x="-28" y="-28" width="200" height="200" rx="24" fill="#ffffff" filter="url(#shadow)"/>
    <g transform="translate(20,20)">
      <rect x="0" y="48" width="56" height="24" rx="12" fill="#111827"/>
      <rect x="124" y="48" width="56" height="24" rx="12" fill="#111827"/>
      <rect x="40" y="36" width="100" height="48" rx="12" fill="url(#grad1)"/>
    </g>
  </g>

  <!-- Accent circles -->
  <circle cx="1080" cy="720" r="10" fill="#22c55e"/>
  <circle cx="1030" cy="760" r="6" fill="#06b6d4"/>
  <circle cx="980" cy="720" r="8" fill="#4f46e5"/>
</svg>
