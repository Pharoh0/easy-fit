<?xml version="1.0" encoding="UTF-8"?>
<svg width="300px" height="200px" viewBox="0 0 300 200" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Empty State</title>
    <defs>
        <linearGradient x1="50%" y1="0%" x2="50%" y2="100%" id="linearGradient-1">
            <stop stop-color="#E4E7FF" offset="0%"></stop>
            <stop stop-color="#D8DCFF" offset="100%"></stop>
        </linearGradient>
        <linearGradient x1="50%" y1="0%" x2="50%" y2="100%" id="linearGradient-2">
            <stop stop-color="#4E73DF" offset="0%"></stop>
            <stop stop-color="#3A54B4" offset="100%"></stop>
        </linearGradient>
    </defs>
    <g id="Empty-State" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="Background" fill="url(#linearGradient-1)" x="0" y="0" width="300" height="200" rx="8"></rect>
        <g id="Empty-Box" transform="translate(75.000000, 40.000000)">
            <rect id="Box" fill="#FFFFFF" x="0" y="20" width="150" height="100" rx="4"></rect>
            <rect id="Box-Shadow" fill="#DEDEDE" opacity="0.5" x="5" y="25" width="150" height="100" rx="4"></rect>
            <path d="M75,0 L95,20 L55,20 L75,0 Z" id="Box-Top" fill="#F0F0F0"></path>
            <path d="M150,20 L150,120 L95,20 L150,20 Z" id="Box-Side" fill="#EBEBEB"></path>
            <path d="M20,45 L130,45 L130,110 L20,110 L20,45 Z" id="Box-Inside" stroke="#DEDEDE" stroke-width="2" stroke-dasharray="5,5"></path>
            <g id="Empty-Icon" transform="translate(55.000000, 60.000000)">
                <circle id="Circle" fill="url(#linearGradient-2)" opacity="0.2" cx="20" cy="20" r="20"></circle>
                <path d="M27.5,12.5 L12.5,27.5" id="Line" stroke="url(#linearGradient-2)" stroke-width="3" stroke-linecap="round"></path>
                <path d="M12.5,12.5 L27.5,27.5" id="Line" stroke="url(#linearGradient-2)" stroke-width="3" stroke-linecap="round"></path>
            </g>
        </g>
        <text id="No-items-found" font-family="Arial-BoldMT, Arial" font-size="12" font-weight="bold" fill="#555555" text-anchor="middle">
            <tspan x="150" y="165">No items found</tspan>
        </text>
    </g>
</svg>
