{% load static %}

<!-- Client Plan Selection Widget for Coach Profile -->
<div class="plan-selection-widget">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">
                <i class="bi bi-clipboard-check me-2"></i>
                Available Plans
            </h5>
        </div>
        <div class="card-body">
            <div id="planSelectionContainer">
                <div class="text-center py-3">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading plans...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Plan Selection Modal -->
<div class="modal fade" id="planSelectionModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-clipboard-check me-2"></i>
                    Select a Plan
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="planModalContent">
                    <!-- Dynamic content will be loaded here -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Subscription Confirmation Modal -->
<div class="modal fade" id="subscriptionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-check-circle me-2"></i>
                    Confirm Subscription
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="subscriptionDetails">
                    <!-- Subscription details will be loaded here -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="confirmSubscriptionBtn">
                    <i class="bi bi-credit-card me-2"></i>Subscribe Now
                </button>
            </div>
        </div>
    </div>
</div>

<style>
.plan-selection-widget {
    margin-bottom: 2rem;
}

.plan-card {
    border: 1px solid #dee2e6;
    border-radius: 10px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    transition: all 0.3s ease;
    cursor: pointer;
}

.plan-card:hover {
    border-color: #0d6efd;
    box-shadow: 0 4px 15px rgba(13, 110, 253, 0.1);
    transform: translateY(-2px);
}

.plan-card.selected {
    border-color: #0d6efd;
    background-color: rgba(13, 110, 253, 0.05);
}

.plan-header {
    display: flex;
    justify-content: between;
    align-items: center;
    margin-bottom: 1rem;
}

.plan-price {
    font-size: 1.5rem;
    font-weight: bold;
    color: #0d6efd;
}

.plan-type-badge {
    font-size: 0.75rem;
    padding: 0.25rem 0.5rem;
    border-radius: 15px;
}

.plan-features {
    list-style: none;
    padding: 0;
    margin: 1rem 0;
}

.plan-features li {
    padding: 0.25rem 0;
    color: #6c757d;
}

.plan-features li i {
    color: #198754;
    margin-right: 0.5rem;
}

.subscription-summary {
    background: #f8f9fa;
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
}

.subscription-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.5rem;
}

.subscription-item:last-child {
    margin-bottom: 0;
    font-weight: bold;
    border-top: 1px solid #dee2e6;
    padding-top: 0.5rem;
}

.loading-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255, 255, 255, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}
</style>

<script>
// Client Plan Selection JavaScript
let selectedPlan = null;
let coachId = null;

// Initialize plan selection widget
function initializePlanSelection(coach_id) {
    coachId = coach_id;
    loadAvailablePlans();
}

// Load available plans for the coach
async function loadAvailablePlans() {
    try {
        const response = await fetch(`/api/v1/plan-management/product-plans/?coach=${coachId}`, {
            headers: {
                'Authorization': `Bearer ${APIBase.getJWTToken()}`,
                'Content-Type': 'application/json'
            }
        });
        
        if (response.ok) {
            const data = await response.json();
            renderPlanSelection(data.results || data);
        } else {
            showPlanSelectionError('Failed to load plans');
        }
    } catch (error) {
        console.error('Error loading plans:', error);
        showPlanSelectionError('Unable to connect to server');
    }
}

// Render plan selection interface
function renderPlanSelection(plans) {
    const container = document.getElementById('planSelectionContainer');
    
    if (plans.length === 0) {
        container.innerHTML = `
            <div class="text-center py-4">
                <i class="bi bi-inbox display-4 text-muted"></i>
                <p class="text-muted mt-2">No plans available from this coach</p>
            </div>
        `;
        return;
    }
    
    container.innerHTML = `
        <div class="row">
            ${plans.map(plan => `
                <div class="col-md-6 mb-3">
                    <div class="plan-card" onclick="selectPlan(${plan.id})">
                        <div class="plan-header">
                            <div>
                                <h6 class="mb-1">${plan.name}</h6>
                                <span class="badge plan-type-badge bg-secondary">${plan.plan_type}</span>
                            </div>
                            <div class="plan-price">$${plan.price}</div>
                        </div>
                        <p class="text-muted small">${plan.description}</p>
                        <ul class="plan-features">
                            <li><i class="bi bi-check"></i>Duration: ${calculateDuration(plan.start_date, plan.end_date)} days</li>
                            <li><i class="bi bi-check"></i>Professional coaching</li>
                            <li><i class="bi bi-check"></i>Progress tracking</li>
                            <li><i class="bi bi-check"></i>24/7 support</li>
                        </ul>
                        <button class="btn btn-primary btn-sm w-100" onclick="event.stopPropagation(); showPlanDetails(${plan.id})">
                            View Details
                        </button>
                    </div>
                </div>
            `).join('')}
        </div>
        <div class="text-center mt-3">
            <button class="btn btn-outline-primary" onclick="showAllPlans()">
                <i class="bi bi-grid me-2"></i>View All Plans
            </button>
        </div>
    `;
}

// Select a plan
function selectPlan(planId) {
    // Remove previous selection
    document.querySelectorAll('.plan-card').forEach(card => {
        card.classList.remove('selected');
    });
    
    // Add selection to clicked card
    event.currentTarget.classList.add('selected');
    selectedPlan = planId;
    
    // Show subscription modal
    showSubscriptionModal(planId);
}

// Show plan details modal
function showPlanDetails(planId) {
    const modal = new bootstrap.Modal(document.getElementById('planSelectionModal'));
    const content = document.getElementById('planModalContent');
    
    content.innerHTML = `
        <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading plan details...</span>
            </div>
        </div>
    `;
    
    modal.show();
    
    // Load plan details
    loadPlanDetails(planId);
}

// Load detailed plan information
async function loadPlanDetails(planId) {
    try {
        const response = await fetch(`/api/v1/plan-management/product-plans/${planId}/`, {
            headers: {
                'Authorization': `Bearer ${APIBase.getJWTToken()}`,
                'Content-Type': 'application/json'
            }
        });
        
        if (response.ok) {
            const plan = await response.json();
            renderPlanDetails(plan);
        } else {
            showPlanDetailsError();
        }
    } catch (error) {
        console.error('Error loading plan details:', error);
        showPlanDetailsError();
    }
}

// Render detailed plan information
function renderPlanDetails(plan) {
    const content = document.getElementById('planModalContent');
    
    content.innerHTML = `
        <div class="plan-details">
            <div class="row">
                <div class="col-md-8">
                    <h4>${plan.name}</h4>
                    <p class="text-muted">${plan.description}</p>
                    
                    <h6>Plan Features:</h6>
                    <ul class="plan-features">
                        <li><i class="bi bi-check"></i>Duration: ${calculateDuration(plan.start_date, plan.end_date)} days</li>
                        <li><i class="bi bi-check"></i>Plan Type: ${plan.plan_type}</li>
                        <li><i class="bi bi-check"></i>Professional coaching support</li>
                        <li><i class="bi bi-check"></i>Personalized workout plans</li>
                        <li><i class="bi bi-check"></i>Nutrition guidance</li>
                        <li><i class="bi bi-check"></i>Progress tracking and analytics</li>
                        <li><i class="bi bi-check"></i>24/7 chat support</li>
                    </ul>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body text-center">
                            <div class="plan-price mb-3">$${plan.price}</div>
                            <button class="btn btn-primary w-100" onclick="showSubscriptionModal(${plan.id})">
                                <i class="bi bi-credit-card me-2"></i>Subscribe Now
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;
}

// Show subscription confirmation modal
function showSubscriptionModal(planId) {
    // Close plan details modal if open
    const planModal = bootstrap.Modal.getInstance(document.getElementById('planSelectionModal'));
    if (planModal) {
        planModal.hide();
    }
    
    const modal = new bootstrap.Modal(document.getElementById('subscriptionModal'));
    const details = document.getElementById('subscriptionDetails');
    
    details.innerHTML = `
        <div class="text-center py-3">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading subscription details...</span>
            </div>
        </div>
    `;
    
    modal.show();
    
    // Load subscription details
    loadSubscriptionDetails(planId);
}

// Load subscription details
async function loadSubscriptionDetails(planId) {
    try {
        const response = await fetch(`/api/v1/plan-management/product-plans/${planId}/`, {
            headers: {
                'Authorization': `Bearer ${APIBase.getJWTToken()}`,
                'Content-Type': 'application/json'
            }
        });
        
        if (response.ok) {
            const plan = await response.json();
            renderSubscriptionDetails(plan);
        } else {
            showSubscriptionError();
        }
    } catch (error) {
        console.error('Error loading subscription details:', error);
        showSubscriptionError();
    }
}

// Render subscription details
function renderSubscriptionDetails(plan) {
    const details = document.getElementById('subscriptionDetails');
    
    details.innerHTML = `
        <div class="subscription-summary">
            <h6>Subscription Summary</h6>
            <div class="subscription-item">
                <span>Plan:</span>
                <span>${plan.name}</span>
            </div>
            <div class="subscription-item">
                <span>Type:</span>
                <span>${plan.plan_type}</span>
            </div>
            <div class="subscription-item">
                <span>Duration:</span>
                <span>${calculateDuration(plan.start_date, plan.end_date)} days</span>
            </div>
            <div class="subscription-item">
                <span>Price:</span>
                <span>$${plan.price}</span>
            </div>
            <div class="subscription-item">
                <span><strong>Total:</strong></span>
                <span><strong>$${plan.price}</strong></span>
            </div>
        </div>
        
        <div class="alert alert-info">
            <i class="bi bi-info-circle me-2"></i>
            By subscribing, you agree to our terms of service and will have access to all plan features.
        </div>
    `;
    
    // Store plan ID for subscription
    document.getElementById('confirmSubscriptionBtn').setAttribute('data-plan-id', plan.id);
}

// Confirm subscription
document.getElementById('confirmSubscriptionBtn').addEventListener('click', async function() {
    const planId = this.getAttribute('data-plan-id');
    const button = this;
    const originalText = button.innerHTML;
    
    button.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Processing...';
    button.disabled = true;
    
    try {
        const response = await fetch('/api/v1/plan-management/plan-subscriptions/', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${APIBase.getJWTToken()}`,
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify({
                product_plan_id: planId
            })
        });
        
        if (response.ok) {
            const result = await response.json();
            showSubscriptionSuccess();
            
            // Close modal after delay
            setTimeout(() => {
                const modal = bootstrap.Modal.getInstance(document.getElementById('subscriptionModal'));
                modal.hide();
                
                // Refresh page or redirect
                window.location.reload();
            }, 2000);
        } else {
            const error = await response.json();
            showSubscriptionError(error.message || 'Subscription failed');
        }
    } catch (error) {
        console.error('Error creating subscription:', error);
        showSubscriptionError('Unable to process subscription');
    } finally {
        button.innerHTML = originalText;
        button.disabled = false;
    }
});

// Utility functions
function calculateDuration(startDate, endDate) {
    const start = new Date(startDate);
    const end = new Date(endDate);
    const diffTime = Math.abs(end - start);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    return diffDays;
}

function showAllPlans() {
    const modal = new bootstrap.Modal(document.getElementById('planSelectionModal'));
    const content = document.getElementById('planModalContent');
    
    content.innerHTML = `
        <div class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading all plans...</span>
            </div>
        </div>
    `;
    
    modal.show();
    loadAvailablePlans();
}

function showPlanSelectionError(message) {
    const container = document.getElementById('planSelectionContainer');
    container.innerHTML = `
        <div class="alert alert-warning">
            <i class="bi bi-exclamation-triangle me-2"></i>
            ${message}
        </div>
    `;
}

function showPlanDetailsError() {
    const content = document.getElementById('planModalContent');
    content.innerHTML = `
        <div class="alert alert-danger">
            <i class="bi bi-exclamation-triangle me-2"></i>
            Failed to load plan details. Please try again.
        </div>
    `;
}

function showSubscriptionError(message = 'Subscription failed') {
    const details = document.getElementById('subscriptionDetails');
    details.innerHTML = `
        <div class="alert alert-danger">
            <i class="bi bi-exclamation-triangle me-2"></i>
            ${message}
        </div>
    `;
}

function showSubscriptionSuccess() {
    const details = document.getElementById('subscriptionDetails');
    details.innerHTML = `
        <div class="alert alert-success">
            <i class="bi bi-check-circle me-2"></i>
            Subscription successful! Welcome to your new fitness journey.
        </div>
    `;
}

// Helper functions for CSRF tokens
// Note: JWT token handling now uses APIBase.getJWTToken()

function getCsrfToken() {
    return document.querySelector('[name=csrfmiddlewaretoken]')?.value || 
           document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');
}

// Export for global use
window.initializePlanSelection = initializePlanSelection;
</script>
