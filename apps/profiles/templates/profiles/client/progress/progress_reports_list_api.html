{% extends 'base.html' %}
{% load static %}

{% block title %}Progress Reports | Easy Fit{% endblock %}

{% block extra_head %}
    <link rel="stylesheet" href="{% static 'profiles/css/client/progress.css' %}">
{% endblock %}

{% block content %}
<div class="container progress-container">
    <div class="row">
        <div class="col-md-12">
            <div class="page-header">
                <h1><i class="fas fa-chart-line"></i> Progress Reports</h1>
                <p>{{ subscription.name }}</p>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <div class="action-buttons">
                <a href="{% url 'profiles:subscription_detail' subscription.id %}" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left"></i> Back to Subscription
                </a>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="text-center my-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Error Container -->
    <div id="error-container" class="alert alert-danger my-3" style="display: none;"></div>

    <!-- Progress Reports List Container -->
    <div id="progress-reports-list" class="row mt-4" data-subscription-id="{{ subscription.id }}">
        <!-- Reports will be loaded here via JavaScript -->
    </div>
</div>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'profiles/js/api.js' %}"></script>
    <script src="{% static 'profiles/js/client/progress_reports.js' %}"></script>
{% endblock %}
