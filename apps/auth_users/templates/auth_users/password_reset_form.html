{% extends 'base.html' %}
{% load static %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header text-center">
          <h4 class="mb-0">Forgot your password?</h4>
        </div>
        <div class="card-body">
          <p class="text-muted">Enter the email address associated with your account, and we'll email you a link to reset your password.</p>
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="id_email" class="form-label">Email address</label>
              <input type="email" name="email" autocomplete="email" required id="id_email" class="form-control" placeholder="you@example.com">
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Send reset link</button>
            </div>
          </form>
          <div class="text-center mt-3">
            <a href="{% url 'auth_users:user-login' %}">&larr; Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
{% endblock %}
