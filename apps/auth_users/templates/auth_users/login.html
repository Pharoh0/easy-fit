{% extends 'base.html' %}
{% load static %}

{% block title %}Login{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'auth_users/css/login.css' %}">
{% endblock %}


{% block content %}

<div class="login-container">
    <div class="row">
        <!-- Left Section with Decorative Elements -->
        <div class="col-md-6">
            <div class="welcome-section text-white">
                <div class="decorative-elements">
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="wavy-line"></div>
                    <div class="plus"></div>
                </div>
                <h1 class="display-4 fw-bold mb-4">Welcome back!</h1>
                <p class="lead">You can sign in to access with your existing account.</p>
            </div>
        </div>
        <!-- Right Section with Sign In Form -->
        <div class="col-md-6 bg-white">
                <div class="login-card">
                    <div class="card-header text-center">
                        <h2 class="fw-bold mb-0">Sign In</h2>
                    </div>
            <!-- Card Body -->
            <div class="card-body">
                <form method="post" id="login-form">
                    {% csrf_token %}
                    <!-- Username Field -->
                    <div class="mb-4">
                        <label for="id_username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person-fill"></i>
                            </span>
                            <input type="text" name="username" class="form-control" id="id_username" placeholder="Enter your username" required>
                        </div>
                    </div>
                    <!-- Password Field -->
                    <div class="mb-4">
                        <label for="id_password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-lock-fill text-primary"></i>
                            </span>
                            <input type="password" name="password" class="form-control border-start-0" id="id_password" placeholder="Enter your password" required>
                        </div>
                    </div>
                    <!-- Remember Me & Forgot Password -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="keep_logged_in">
                            <label class="form-check-label" for="keep_logged_in">Keep me logged in</label>
                        </div>
                        <a href="#" class="text-primary fw-semibold text-decoration-none">Forgot Password?</a>
                    </div>
                    <!-- Error Messages -->
                    <div id="error-messages" class="text-danger mb-3"></div>
                    <!-- Login Button -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg fw-semibold" style="background: linear-gradient(to right, #4e73df, #224abe); border: none;">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Log In
                        </button>
                    </div>
                    <!-- Register Link -->
                    <p class="text-center mb-0">Don't have an account? <a href="{% url 'auth_users:user-register' %}" class="text-primary fw-semibold text-decoration-none">Sign up</a></p>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Script for form handling -->
<script>
    document.getElementById('login-form').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const form = event.target;
        const username = form.querySelector('#id_username').value;
        const password = form.querySelector('#id_password').value;
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
        const errorMessagesDiv = document.getElementById('error-messages');
        const submitButton = form.querySelector('button[type="submit"]');
        const originalButtonText = submitButton.innerHTML;
        
        // Show loading state
        submitButton.disabled = true;
        submitButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Signing in...';
        errorMessagesDiv.innerHTML = ''; // Clear previous errors

        // Create JSON payload
        const loginData = {
            username: username,
            password: password
        };
        console.log('Login data:', loginData);
        
        fetch("{% url 'auth_users:api-user-login' %}", {
            method: 'POST',
            body: JSON.stringify(loginData),
            headers: {
                'X-CSRFToken': csrfToken,
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            credentials: 'same-origin'
        })
        .then(response => {
            console.log('Login response status:', response.status);
            
            // Always try to parse JSON first
            return response.json().then(data => {
                console.log('Login response data:', data);
                if (response.ok) {
                    return data;
                } else {
                    throw new Error(data.detail || 'Login failed. Please check your username and password.');
                }
            }).catch(e => {
                console.log('JSON parsing error:', e);
                // If JSON parsing fails, throw a generic error
                throw new Error('Login failed. Please check your username and password.');
            });
        })
        .then(data => {
            console.log('Login response:', data);
            if (data.tokens && data.tokens.access && data.tokens.refresh) {
                // Store tokens in localStorage
                localStorage.setItem('access_token', data.tokens.access);
                localStorage.setItem('refresh_token', data.tokens.refresh);
                
                // Redirect to the dashboard
                window.location.href = data.redirect_url || "{% url 'auth_users:dashboard' %}";
            } else {
                throw new Error('Invalid response from server. Please try again.');
            }
        })
        .catch(error => {
            console.error('Login error:', error);
            // Display error in a more user-friendly way
            errorMessagesDiv.innerHTML = `
                <div class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    ${error.message}
                </div>`;
            
            // Reset button state
            submitButton.disabled = false;
            submitButton.innerHTML = originalButtonText;
        });
    });
</script>
{% endblock %}
