{% extends 'base.html' %}
{% load static %}

{% block title %}Login{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'auth_users/css/login.css' %}">
{% endblock %}


{% block content %}

<div class="login-container">
    <div class="row">
        <!-- Left Section with Decorative Elements -->
        <div class="col-md-6">
            <div class="welcome-section text-white">
                <div class="decorative-elements">
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="wavy-line"></div>
                    <div class="plus"></div>
                </div>
                <h1 class="display-4 fw-bold mb-4">Welcome back!</h1>
                <p class="lead">You can sign in to access with your existing account.</p>
            </div>
        </div>
        <!-- Right Section with Sign In Form -->
        <div class="col-md-6 bg-white">
                <div class="login-card">
                    <div class="card-header text-center">
                        <h2 class="fw-bold mb-0">Sign In</h2>
                    </div>
            <!-- Card Body -->
            <div class="card-body">
                <form method="post" id="login-form">
                    {% csrf_token %}
                    <!-- Username Field -->
                    <div class="mb-4">
                        <label for="id_username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person-fill"></i>
                            </span>
                            <input type="text" name="username" class="form-control" id="id_username" placeholder="Enter your username" required>
                        </div>
                    </div>
                    <!-- Password Field -->
                    <div class="mb-4">
                        <label for="id_password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-lock-fill text-primary"></i>
                            </span>
                            <input type="password" name="password" class="form-control border-start-0" id="id_password" placeholder="Enter your password" required>
                        </div>
                    </div>
                    <!-- Remember Me & Forgot Password -->
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="keep_logged_in">
                            <label class="form-check-label" for="keep_logged_in">Keep me logged in</label>
                        </div>
                        <a href="{% url 'auth_users:password_reset' %}" class="text-primary fw-semibold text-decoration-none">Forgot Password?</a>
                    </div>
                    <!-- Error Messages -->
                    <div id="error-messages" class="text-danger mb-3"></div>
                    <!-- Hidden container for raw error data (for debugging) -->
                    <div id="raw-error-data" style="display: none;"></div>
                    <!-- Login Button -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg fw-semibold" style="background: linear-gradient(to right, #4e73df, #224abe); border: none;">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Log In
                        </button>
                    </div>
                    <!-- Register Link -->
                    <p class="text-center mb-0">Don't have an account? <a href="{% url 'auth_users:user-register' %}" class="text-primary fw-semibold text-decoration-none">Sign up</a></p>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Script for form handling -->
<script>
    document.getElementById('login-form').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const form = event.target;
        const username = form.querySelector('#id_username').value;
        const password = form.querySelector('#id_password').value;
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
        const errorMessagesDiv = document.getElementById('error-messages');
        const submitButton = form.querySelector('button[type="submit"]');
        const originalButtonText = submitButton.innerHTML;
        
        // Show loading state
        submitButton.disabled = true;
        submitButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Signing in...';
        errorMessagesDiv.innerHTML = ''; // Clear previous errors

        // Create JSON payload
        const loginData = {
            username: username,
            password: password
        };
        console.log('Login data:', loginData);
        
        // Store data globally for debugging purposes
        window.lastLoginResponse = null;
        window.lastLoginError = null;
        
        fetch("{% url 'auth_users:api-user-login' %}", {
            method: 'POST',
            body: JSON.stringify(loginData),
            headers: {
                'X-CSRFToken': csrfToken,
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            credentials: 'same-origin'
        })
        .then(response => {
            console.log('Login response status:', response.status);
            // Get raw response text first for robust handling
            return response.text().then(rawText => {
                let data = null;
                try { data = JSON.parse(rawText); } catch (e) { data = null; }
                window.lastLoginResponse = data;

                // If unverified, redirect to verification page
                if (!response.ok && data && data.requires_email_verification && data.redirect_url) {
                    try { sessionStorage.setItem('pending_verification_email', data.email || ''); } catch (e) {}
                    try { if (window.APIBase && typeof APIBase.clearAllTokens === 'function') APIBase.clearAllTokens(); } catch (e) {}
                    window.location.href = data.redirect_url;
                    return new Promise(() => {}); // stop chain
                }

                if (response.ok && data) {
                    return data; // success path
                }

                // Handle error formats and extract a message
                if (data && data.status === 'error' && data.errors) {
                    if (data.errors.__all__ && Array.isArray(data.errors.__all__)) {
                        const msg = data.errors.__all__[0];
                        document.getElementById('raw-error-data').textContent = msg;
                        throw new Error(msg);
                    }
                }

                let errorMessage = '';
                if (data) {
                    if (data.__all__ && Array.isArray(data.__all__)) {
                        errorMessage = data.__all__[0];
                    } else if (data.errors && typeof data.errors === 'object') {
                        const firstKey = Object.keys(data.errors)[0];
                        if (firstKey && data.errors[firstKey]) {
                            errorMessage = Array.isArray(data.errors[firstKey]) ? data.errors[firstKey][0] : data.errors[firstKey];
                        }
                    } else if (data.detail) {
                        errorMessage = data.detail;
                    } else if (data.non_field_errors && Array.isArray(data.non_field_errors)) {
                        errorMessage = data.non_field_errors[0];
                    }
                }
                if (!errorMessage) errorMessage = (typeof rawText === 'string' && rawText.trim()) ? rawText : 'Login failed. Please check your credentials.';
                throw new Error(errorMessage);
            });
        })
        .then(data => {
            console.log('Login response:', data);
            if (data.tokens && data.tokens.access && data.tokens.refresh) {
                // Store tokens in localStorage
                localStorage.setItem('access_token', data.tokens.access);
                localStorage.setItem('refresh_token', data.tokens.refresh);
                
                // Redirect to the dashboard
                window.location.href = data.redirect_url || "{% url 'auth_users:dashboard' %}";
            } else {
                throw new Error('Invalid response from server. Please try again.');
            }
        })
        .catch(error => {
            console.error('Login error:', error);
            console.log('Error type:', typeof error);
            console.log('Is error an Error instance:', error instanceof Error);
            
            // Get the error message
            let errorMsg = '';
            
            if (error && error.response && error.response.data) {
                // Handle axios-style error responses
                const responseData = error.response.data;
                console.log('Error response data:', responseData);
                
                if (responseData.status === 'error' && responseData.errors && responseData.errors.__all__) {
                    errorMsg = Array.isArray(responseData.errors.__all__) ? 
                        responseData.errors.__all__[0] : responseData.errors.__all__;
                } else {
                    errorMsg = JSON.stringify(responseData);
                }
            } else if (error instanceof Error) {
                // Extract the actual message from Error objects
                let message = error.message;
                console.log('Raw error message from Error object:', message);
                
                // Check if message is a stringified JSON
                try {
                    if (message.startsWith('{') && message.endsWith('}')) {
                        const jsonData = JSON.parse(message);
                        if (jsonData.status === 'error' && jsonData.errors && jsonData.errors.__all__) {
                            errorMsg = Array.isArray(jsonData.errors.__all__) ? 
                                jsonData.errors.__all__[0] : jsonData.errors.__all__;
                        } else {
                            errorMsg = message;
                        }
                    } else {
                        errorMsg = message;
                    }
                } catch (e) {
                    // If it's not valid JSON, just use the message as is
                    errorMsg = message;
                }
                
                console.log('Processed error message:', errorMsg);
            } else if (typeof error === 'object') {
                // Try to extract meaningful message from object
                try {
                    const jsonString = JSON.stringify(error);
                    try {
                        const jsonData = JSON.parse(jsonString);
                        if (jsonData.status === 'error' && jsonData.errors && jsonData.errors.__all__) {
                            errorMsg = Array.isArray(jsonData.errors.__all__) ? 
                                jsonData.errors.__all__[0] : jsonData.errors.__all__;
                        } else {
                            errorMsg = 'Login failed. Please check your credentials.';
                        }
                    } catch (e) {
                        errorMsg = 'Login failed. Please check your credentials.';
                    }
                } catch (e) {
                    errorMsg = 'Unknown error occurred';
                }
            } else if (typeof error === 'string') {
                errorMsg = error;
            } else {
                errorMsg = 'Login failed. Please check your username and password.';
            }
            
            // Check if error message contains block information to style differently
            const isBlocked = errorMsg.toLowerCase().includes('blocked') || errorMsg.toLowerCase().includes('disabled');
            
            // Log whether this is a blocked user message
            console.log('Is blocked user message:', isBlocked);
            console.log('Final displayed error message:', errorMsg);
            
            // Render error and optionally a verification link if needed
            const requiresVerify = errorMsg.toLowerCase().includes('verify your email');
            const verifyHtml = requiresVerify ? `
                <div class="mt-2">
                    <a class="btn btn-outline-primary btn-sm" href="/auth-users/verify/">Go to verification page</a>
                </div>` : '';
            errorMessagesDiv.innerHTML = `
                <div class="alert ${isBlocked ? 'alert-warning' : 'alert-danger'}" role="alert">
                    <i class="bi ${isBlocked ? 'bi-shield-exclamation' : 'bi-exclamation-triangle-fill'} me-2"></i>
                    ${errorMsg}
                    ${verifyHtml}
                </div>`;
            
            // Reset button state
            submitButton.disabled = false;
            submitButton.innerHTML = originalButtonText;
        });
    });
</script>
{% endblock %}
